[workspace]
resolver = "3"
members = ["crates/protocol", "crates/rtti", "crates/endpoint", "crates/agent", "crates/unstable", "crates/injector", "crates/mcp", "crates/ocr"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.60"
endpoint = { path = "crates/endpoint" }
rtti = { path = "crates/rtti" }
ocr = { path = "crates/ocr" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The agent runs inside Minecraft: a panic there must not unwind into game
# code, and a small DLL loads faster.
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"

# Development builds stay incremental, but dependencies and OCR, which the server runs on
# every capture, are optimized once so the debug server still reads text quickly.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ocr]
opt-level = 2

# An optimized build for testing performance without the release profile's whole-program
# optimization: `cargo build --profile fast`. Ship with `--release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
