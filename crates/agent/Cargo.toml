[package]
name = "bedrock-agent"
description = "Agent DLL loaded into Minecraft.Windows.exe"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "bedrock_agent"
crate-type = ["cdylib"]

[dependencies]
protocol.workspace = true
endpoint.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Performance", "Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }

[lints]
workspace = true
