[package]
name = "bedrock-mcp"
description = "Bedrock MCP for Minecraft by Red Eagle Studios: agentic AI add-on development and testing on Minecraft Bedrock, on Windows or on Linux under mcbe-gdk-linux"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
memmap2 = "0.9"
ocr.workspace = true
png = "0.18"
polling = "3"
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tungstenite = "0.30"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
bedrock-inject = { path = "../injector" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[lints]
workspace = true
